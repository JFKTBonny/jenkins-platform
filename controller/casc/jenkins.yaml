# Core settings, authentication, authorization, agents.
# The "jenkins:" root key must appear ONLY in this file.
jenkins:
  systemMessage: "Managed by JCasC - changes made in the UI are overwritten on restart"

  # No builds on the controller
  numExecutors: 0
  mode: EXCLUSIVE

  disableRememberMe: true
  markupFormatter: "plainText"     # prevents XSS via job descriptions
  slaveAgentPort: 50000            # set to -1 if you use no inbound agents

  crumbIssuer: "standard"                    # CSRF protection - never disable
    

  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "admin"
          password: "${ADMIN_PASSWORD}"

  # Anonymous has no entry, so it has no permissions at all
  authorizationStrategy:
    globalMatrix:
      entries:
        - user:
            name: "admin"
            permissions:
              - "Overall/Administer"
        - group:
            name: "authenticated"
            permissions:
              - "Overall/Read"
              - "Job/Read"
              - "Job/Build"
              - "Job/Cancel"
              - "View/Read"

  # Inbound agent; its secret is shown at Manage Jenkins -> Nodes -> agent1
  nodes:
    - permanent:
        name: "agent1"
        labelString: "linux"
        remoteFS: "/home/jenkins/agent"
        numExecutors: 2
        mode: NORMAL
        retentionStrategy: "always"
        launcher:
          inbound:
            workDirSettings:
              disabled: false
              failIfWorkDirIsMissing: false
              internalDir: "remoting"
