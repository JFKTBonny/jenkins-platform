# Credentials, filled from environment variables (.env). Never put real values here.
# The "credentials:" root key must appear ONLY in this file.
credentials:
  system:
    domainCredentials:
      - credentials:
          - usernamePassword:
              scope: GLOBAL
              id: "dockerhub-creds"
              description: "Docker Hub"
              username: "${DOCKERHUB_USER}"
              password: "${DOCKERHUB_PASSWORD}"
          - usernamePassword:
              scope: GLOBAL
              id: "github-creds"
              description: "GitHub user + personal access token"
              username: "${GITHUB_USER}"
              password: "${GITHUB_TOKEN}"
