services:
  jenkins:
    build: ./controller
    image: my-jenkins:latest
    container_name: jenkins
    restart: unless-stopped
    env_file: .env
    ports:
      # Only reachable from this host; Nginx publishes it over HTTPS
      - "127.0.0.1:8080:8080"
      # Uncomment only if agents on OTHER machines must connect (restrict with firewall)
      # - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
    networks:
      - jenkins-net

volumes:
  jenkins_home:
    name: jenkins_home

networks:
  jenkins-net:
    name: jenkins-net
